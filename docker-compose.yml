services:
  n8n-postgres:
    image: postgres:13-alpine
    container_name: ariz-n8n-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-n8n_password}
      POSTGRES_DB: n8n
    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ariz-network

  n8n:
    image: n8nio/n8n:1.114.3
    container_name: ariz-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-n8n_password}
      - N8N_PROTOCOL=http
      - N8N_HOST=n8n
      - N8N_PORT=5678
      - N8N_WEBHOOK_URL=http://localhost:${N8N_PORT:-5678}
      - WEBHOOK_URL=http://localhost:${N8N_PORT:-5678}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-change-me-to-a-long-random-string}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-UTC}
      - N8N_BASIC_AUTH_ACTIVE=false
      - NODE_ENV=production
      - GIGACHAT_TIMEOUT=${GIGACHAT_TIMEOUT:-300}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      n8n-postgres:
        condition: service_healthy
    networks:
      - ariz-network

  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.8.3
    container_name: ariz-openwebui
    restart: unless-stopped
    ports:
      - "${OPENWEBUI_PORT:-3000}:8080"
    volumes:
      - openwebui_data:/app/backend/data
    environment:
      - ENABLE_FUNCTION_CALLING=true
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-change-me-webui-secret}
      - ENV=production
      - WEBUI_NAME=ariz-agent
      - WEBUI_URL=http://localhost:${OPENWEBUI_PORT:-3000}
      - WEBUI_AUTH=default
      - N8N_ENABLED=true
      - N8N_BASE_URL=http://n8n:5678
      - ENABLE_OLLAMA_API=${ENABLE_OLLAMA_API:-false}
    depends_on:
      - n8n
    networks:
      - ariz-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ariz-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ariz-network

  patent_service:
    build:
      context: .
      dockerfile: patent_service/Dockerfile
    container_name: ariz-patent-service
    restart: unless-stopped
    ports:
      - "${PATENT_SERVICE_PORT:-8000}:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_PATENTS_COLLECTION=patents
    depends_on:
      - qdrant
    networks:
      - ariz-network

volumes:
  n8n_postgres_data:
  n8n_data:
  openwebui_data:
  qdrant_data:

networks:
  ariz-network:
    driver: bridge
